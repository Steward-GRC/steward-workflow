name: Image Publish
# Builds each service image natively on an amd64 runner and an arm64 runner (no
# QEMU), pushes each platform by digest, then joins the digests into one
# manifest list on GHCR. The publish runs on a published release or a manual
# dispatch only, never on a push. A pull request that touches the image build
# inputs runs the same native builds without pushing (the verify job), so CI
# proves both platforms build before a release needs them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for a release this is the release tag)
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/job-image-publish.yaml"
permissions:
  contents: read
concurrency:
  group: image-publish-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  REGISTRY: ghcr.io/steward-grc
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  verify:
    name: 🐳 Verify ${{ matrix.image }} (${{ matrix.platform }})
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: steward-workflow
            dockerfile: Dockerfile
            context: .
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: steward-workflow
            dockerfile: Dockerfile
            context: .
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=pr-${{ github.event.number }}
            COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          push: false

  build:
    name: 🐳 Build ${{ matrix.image }} (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: steward-workflow
            dockerfile: Dockerfile
            context: .
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: steward-workflow
            dockerfile: Dockerfile
            context: .
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$TAG' is not a valid image tag"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 🐳 Merge ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - steward-workflow
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do
            refs+=("$IMAGE@sha256:$digest")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${#refs[@]}"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${refs[@]}"
      - name: Verify both platforms are listed
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --raw \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort)
          echo "platforms: $platforms"
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "$want" <<< "$platforms"; then
              echo "::error::$IMAGE:$TAG does not list $want"
              exit 1
            fi
          done
