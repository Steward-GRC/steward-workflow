syntax = "proto3";

package steward.workflow.v1;

option go_package = "github.com/Steward-GRC/steward-workflow/gen/go/steward/workflow/v1;workflowv1";

// ApproverList is the individual approvers a stage names for one category.
message ApproverList {
  repeated string user_ids = 1;
}

// GroupUnit is a group that approves as a whole. Its members hold their own
// group seats on the stage, separate from any individual seat they also hold.
// The group is satisfied once its internal quorum of members say yes, and a
// satisfied group counts as one vote in the stage's quorum.
message GroupUnit {
  string group_id = 1;
  // "one", "majority" or "all".
  string internal_quorum = 2;
  repeated string member_user_ids = 3;
}

// WorkflowStage is one ordered step of a workflow.
message WorkflowStage {
  // Stable id the editor keeps across saves.
  string id = 1;
  string name = 2;
  // Individual approvers for every category without its own entry in
  // approvers_by_category.
  repeated string approver_ids = 3;
  // "one", "majority" or "all".
  string quorum = 4;
  // Whole working days on the site calendar, counted from stage entry to the
  // end of the Nth working day. Zero means the service-wide SLA.
  int32 sla_days = 5;
  // Rejects the version when the stage is still undecided at its due date. A
  // time limit never approves.
  bool reject_on_sla_breach = 6;
  // Editor ordering only.
  bool pinned_last = 7;
  // Individual approvers by category id. A policy uses the entry for its home
  // category, then the nearest ancestor that has one.
  map<string, ApproverList> approvers_by_category = 8;
  repeated GroupUnit group_units = 9;
  // The people on this stage whose single reject ends the version as rejected
  // at once, even inside a quorum. There is no workflow-wide switch: a
  // non-empty list applies by itself. Each must be one of the stage's explicit
  // approvers (approver_ids, approvers_by_category or a group unit's
  // member_user_ids); a save that names anyone else is refused with
  // InvalidArgument. At submit a named person who is not seated in the stage's
  // approver pool holds no veto, without an error. Site admin, root and owners
  // who join only to make up a quorum never hold one.
  repeated string veto_user_ids = 12;

  // Whole working days on the run's site calendar, counted past the due date
  // (sla_days). Zero means off. Both need sla_days above zero and cannot be set
  // on a stage that has reject_on_sla_breach, which rejects at the due date, so
  // such a save is refused with InvalidArgument. Each is 0 to 365.
  //
  // remind_every_days: once the stage is past due, each approver who has not
  // decided is reminded at the due date and then every N working days.
  // escalate_after_days: when the stage is still undecided N working days after
  // the due date, the category owners are told once. Escalation only notifies:
  // it adds no approver and never approves or rejects.
  int32 remind_every_days = 13;
  int32 escalate_after_days = 14;

  // veto_approver_ids and veto_group_ids were the old per-stage marks, replaced
  // by veto_user_ids. Never reuse the numbers or names.
  reserved 10, 11;
  reserved "veto_approver_ids", "veto_group_ids";
}

// WorkflowDef is an admin-authored approval workflow. Every update bumps the
// version; a run stays on the version it was submitted under.
message WorkflowDef {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 version = 4;
  repeated WorkflowStage stages = 5;
  // Who created or last edited the definition. They may reassign its runs'
  // approvals as the workflow author.
  string author_user_id = 6;

  // veto_enabled was the old workflow-wide veto switch; the veto belongs to
  // people on a stage (WorkflowStage.veto_user_ids). Never reuse the number or
  // name.
  reserved 7;
  reserved "veto_enabled";
}

message ListWorkflowDefsRequest {}

message ListWorkflowDefsResponse {
  repeated WorkflowDef defs = 1;
}

message GetWorkflowDefRequest {
  string id = 1;
}

message GetWorkflowDefResponse {
  WorkflowDef def = 1;
}

message CreateWorkflowDefRequest {
  string name = 1;
  string description = 2;
  repeated WorkflowStage stages = 3;
  string actor_user_id = 4;
}

message CreateWorkflowDefResponse {
  WorkflowDef def = 1;
}

message UpdateWorkflowDefRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated WorkflowStage stages = 4;
  string actor_user_id = 5;
}

message UpdateWorkflowDefResponse {
  WorkflowDef def = 1;
}

message ArchiveWorkflowDefRequest {
  string id = 1;
  string actor_user_id = 2;
}

message ArchiveWorkflowDefResponse {}
