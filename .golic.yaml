# The Steward header: two SPDX lines above the code, written as line comments,
# as in:
#   // Copyright 2026 The Steward Authors
#   // SPDX-License-Identifier: Apache-2.0
golic:
  licenses:
    spdx-apache2: |
      Copyright {{copyright}}
      SPDX-License-Identifier: Apache-2.0
  rules:
    .go:
      prefix: "// "
    .proto:
      prefix: "// "
